<form  action="/retailer_chat_user" method="post" name="form1" id="form1">
<div class="title-content text-center">
          
          <h3 align="center" class="title-w3l mb-sm-3 text-center">Chat</h3>
  </div>
  <table width="374" height="217" align="center">
    <tr>
      <td>&nbsp;</td>
      <td>&nbsp;</td>
    </tr>
    <tr>
      <td>Chat</td>
      <td><input name="chat" type="text" id="chat"   required="" /></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td><input type="submit" name="btn" value="Send" /></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td>&nbsp;</td>
    </tr>
	{% for row in items %}
    <tr>
      <td>{{ row[4] }} </td>
      <td>{{ row[2] }} </td>
    </tr>
	{% endfor %}
    <tr>
      <td>&nbsp;</td>
      <td>&nbsp;</td>
    </tr>
  </table>
</form>
