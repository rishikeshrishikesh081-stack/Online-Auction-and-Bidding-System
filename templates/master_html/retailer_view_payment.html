<style type="text/css">
<!--
.style1 {font-size: 24px}
-->
</style>

<form  action="/retailer_view_payment" method="post" name="form1" id="form1">
<div class="title-content text-center">
          
          <h3 align="center" class="title-w3l mb-sm-3 text-center style1">Payment Details </h3>
  </div>
  <table width="832" height="175" align="center">
  
    <tr>
      <td><div align="center" class="style1"><strong>Holder Name </strong></div></td>
      <td><div align="center" class="style1"><strong>Account Number</strong></div></td>
      <td><div align="center" class="style1"><strong>Cvv</strong></div></td>
      <td><div align="center" class="style1"><strong>Product Name</strong></div></td>
     <td><div align="center" class="style1"><strong>Product Brand </strong></div></td>
       <td><div align="center" class="style1"><strong>Amount</strong></div></td>
    </tr>
	 {% for row in items %}
    <tr>
      
      <td><div align="center">{{ row[1] }}</div></td>
      <td><div align="center">{{ row[2] }}</div></td>
      <td><div align="center">{{ row[3] }}</div></td>
      <td><div align="center">{{ row[5] }}</div></td>
      <td><div align="center">{{ row[6] }}</div></td>
      <td><div align="center">{{ row[7] }}</div></td>
    </tr>
	{% endfor %}
  </table>
</form>
<p></p>
<p>&nbsp;</p>
<p>&nbsp;</p>
<p>&nbsp;</p>
